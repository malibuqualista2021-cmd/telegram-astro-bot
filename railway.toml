# Railway: GitHub deploy — Node.js bot (Telegraf + Express health)
# Ortam: BOT_TOKEN, OPENAI_API_KEY (opsiyonel), GEOCODE_USER_AGENT, PORT (Railway verir)
# https://docs.railway.app/deploy/config-as-code

[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
